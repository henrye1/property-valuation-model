services:
  - type: web
    name: property-valuations-web
    env: static
    # Build runs from repo root; rootDir scopes the publish path and installs
    rootDir: packages/web
    buildCommand: npm install -g pnpm@11 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    # SPA rewrite: all paths fall through to index.html so client-side routing works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Build-time env vars — set values in the Render dashboard, NOT committed here.
    # After first deploy:
    #   1. Add the deployed origin (https://<your-app>.onrender.com) to ALLOWED_ORIGINS
    #      in the API service env vars.
    #   2. Add the same origin to Supabase Auth → URL Configuration → Redirect URLs.
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        # The anon key is public-safe (Row Level Security enforces access),
        # but set it via the dashboard rather than committing it.
        sync: false
