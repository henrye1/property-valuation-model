services:
  - type: web
    name: property-valuations-api
    env: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./packages/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: ENV
        value: prod
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BRANDING_FIRM_NAME
        value: Anchor Point Risk (Pty) Ltd
      - key: BRANDING_FIRM_ADDRESS_LINES
        value: ""
      - key: BRANDING_FIRM_CONTACT_LINES
        value: ""
      - key: BRANDING_FIRM_LOGO_PATH
        value: branding/anchorpoint_logo.png
      - key: IMPORT_MAX_FILE_BYTES
        value: "10485760"
      - key: STORAGE_SIGNED_URL_TTL_S
        value: "300"
      - key: DB_ACQUIRE_TIMEOUT_S
        value: "10"
